name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Al-Mahamm-1.5.apk
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Mahamm-1.5
          path: dist/Al-Mahamm-1.5.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.5 >/dev/null 2>&1 || gh release create v1.5 --title "Al-Mahamm 1.5" --notes "إصلاح التسجيل ومنتقي الملفات، وزر إيقاف تطبيقات الخلفية في شريط الإشعارات. احذف النسخة 1.4 قبل التثبيت لأن توقيع هذه النسخة مختلف."
          gh release upload v1.5 dist/Al-Mahamm-1.5.apk --clobber
